<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3354">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="재물조사">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>자산 재물조사</title>
<style>
  :root {
    --navy: #1F3354; --gold: #C08A2C;
    --bg: #f4f5f8; --card: #ffffff; --text: #1b1f27; --muted: #6b7280; --line: #e3e6ec;
    --ok: #15803d; --warn: #b45309; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1420; --card: #1a2131; --text: #e8ebf2; --muted: #9aa3b5; --line: #2b3448; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  header { background: var(--navy); color: #fff; padding: 12px 16px calc(12px) 16px;
           padding-top: max(12px, env(safe-area-inset-top)); position: sticky; top: 0; z-index: 5; }
  header h1 { margin: 0; font-size: 17px; font-weight: 700; }
  .loc { margin-top: 8px; display: flex; align-items: baseline; gap: 8px; }
  .loc .label { font-size: 12px; opacity: .8; }
  .loc .value { font-size: 26px; font-weight: 800; color: var(--gold); letter-spacing: 1px; }
  .loc .value.none { font-size: 16px; color: #ffd27a; font-weight: 600; }
  .count { margin-left: auto; font-size: 13px; opacity: .9; }
  main { padding: 12px 16px 96px; max-width: 640px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  #reader { width: 100%; border-radius: 10px; overflow: hidden; background: #000; min-height: 0; }
  #reader video { width: 100% !important; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 12px 10px; font-weight: 700; cursor: pointer; }
  .primary { background: var(--navy); color: #fff; }
  .gold { background: var(--gold); color: #fff; }
  .ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .danger { background: transparent; color: var(--err); border: 1px solid var(--err); }
  button.armed { outline: 3px solid var(--gold); }
  input[type=text] { font: inherit; width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
                     background: var(--bg); color: var(--text); text-transform: uppercase; }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 2px 0; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom));
           padding: 14px; border-radius: 12px; color: #fff; font-weight: 700; text-align: center;
           opacity: 0; transform: translateY(10px); transition: .18s; z-index: 10; pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }
  .toast.ok { background: var(--ok); } .toast.warn { background: var(--warn); } .toast.err { background: var(--err); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: left; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.mono { font-family: Consolas, Menlo, monospace; }
  td.del button { padding: 4px 8px; font-size: 12px; }
  label.chk { display: flex; gap: 8px; align-items: center; font-size: 13px; margin-top: 8px; }
  h2 { font-size: 14px; margin: 0 0 8px; }
</style>
</head>
<body>
<header>
  <h1>자산 재물조사</h1>
  <div class="loc">
    <span class="label">현재 위치</span>
    <span id="locValue" class="value none">위치 라벨을 먼저 찍으세요</span>
    <span class="count" id="count">0건</span>
  </div>
</header>

<main>
  <section class="card">
    <div id="reader"></div>
    <div class="row" style="margin-top:10px">
      <button id="btnCam" class="primary">카메라 켜기</button>
      <button id="btnLoc" class="gold">위치 라벨 찍기</button>
    </div>
    <div style="margin-top:10px">
      <input id="manual" type="text" inputmode="text" autocomplete="off" autocapitalize="characters"
             placeholder="직접 입력 후 Enter">
    </div>
    <label class="chk"><input type="checkbox" id="autoLoc" checked> S+숫자 4자리(예: S1301)는 위치로 인식</label>
    <p class="hint">위치 라벨을 찍으면 그 뒤로 찍는 자산은 모두 그 위치로 기록됩니다. 같은 자산을 두 번 찍으면 기록하지 않고 알려 줍니다.</p>
  </section>

  <section class="card">
    <h2>엑셀 내보내기</h2>
    <input id="fname" type="text" style="text-transform:none" placeholder="파일 이름">
    <div class="row" style="margin-top:8px">
      <button id="btnSave" class="primary">엑셀 저장</button>
      <button id="btnShare" class="ghost">공유(메일·메신저)</button>
    </div>
    <p class="hint">터미널 프로그램과 같은 양식(.xls, DATE·TIME·LOCATION·BARCODE·QUANTITY)으로 만듭니다.</p>
  </section>

  <section class="card">
    <div class="row" style="align-items:center">
      <h2 style="margin:0">스캔 기록 (최근 순)</h2>
      <button id="btnClear" class="danger" style="flex:0 0 auto">전체 삭제</button>
    </div>
    <table>
      <thead><tr><th>시각</th><th>위치</th><th>자산</th><th></th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </section>
</main>

<div id="toast" class="toast"></div>

<script src="vendor/html5-qrcode.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="export.js"></script>
<script src="app.js"></script>
</body>
</html>
